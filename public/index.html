<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cargar Receta</title>
  <link rel="stylesheet" href="css/estilos.css">
</head>
<body>
  <h2>Cargar una nueva receta</h2>

  <form action="/api/recetas" method="post">
    <label for="titulo">Título:</label><br>
    <input type="text" id="titulo" name="titulo" required><br><br>

    <label for="ingredientes">Ingredientes (separados por coma):</label><br>
    <input type="text" id="ingredientes" name="ingredientes" required><br><br>

    <label for="instrucciones">Instrucciones:</label><br>
    <textarea id="instrucciones" name="instrucciones" rows="4" cols="40" required></textarea><br><br>

    <label for="tiempo">Tiempo de preparación (minutos):</label><br>
    <input type="number" id="tiempo" name="tiempo" required><br><br>

    <button type="submit">Guardar Receta</button>
  </form>

  <hr>

  <h3>Consultas rápidas</h3>
  <ul>
    <li><a href="/api/recetas" target="_blank">Ver todas las recetas</a></li>

  </ul>

</body>
</html>
