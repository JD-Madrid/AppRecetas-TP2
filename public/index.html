<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cargar Receta</title>
  <link rel="stylesheet" href="css/estilos.css">
</head>
<body>
  <h2>Cargar una nueva receta</h2>

  <form action="/api/recetas" method="post">
    <label for="titulo">Título:</label><br>
    <input type="text" id="titulo" name="titulo" required><br><br>

    <label for="ingredientes">Ingredientes (separados por coma):</label><br>
    <input type="text" id="ingredientes" name="ingredientes" required><br><br>

    <label for="instrucciones">Instrucciones:</label><br>
    <textarea id="instrucciones" name="instrucciones" rows="4" cols="40" required></textarea><br><br>

    <label for="tiempo">Tiempo de preparación (minutos):</label><br>
    <input type="number" id="tiempo" name="tiempo" required><br><br>

    <button type="submit">Guardar Receta</button>
  </form>

  <hr>

  <section class="acciones">
    <h3>Descargar o enviar receta existente</h3>
    <div class="campo">
      <label for="recetaId">ID de la receta:</label>
      <input type="text" id="recetaId" placeholder="Ej: 8">
    </div>
    <div class="botones">
      <button type="button" id="btnDescargarPdf">Descargar PDF</button>
    </div>

    <div class="campo">
      <label for="destinatarioEmail">Enviar PDF por mail</label>
      <input type="email" id="destinatarioEmail" placeholder="correo@ejemplo.com">
    </div>
    <div class="campo">
      <label for="asuntoEmail">Asunto (opcional):</label>
      <input type="text" id="asuntoEmail" placeholder="Receta solicitada">
    </div>
    <div class="campo">
      <label for="mensajeEmail">Mensaje (opcional):</label>
      <textarea id="mensajeEmail" rows="3" placeholder="Te enviamos la receta..."></textarea>
    </div>
    <div class="botones">
      <button type="button" id="btnEnviarMail">Enviar por mail</button>
    </div>
    <p id="estadoEmail"></p>
  </section>

  <hr>

  <h3>Consultas rápidas</h3>
  <ul>
    <li><a href="/api/recetas" target="_blank">Ver todas las recetas</a></li>
  </ul>

  <script>
    const recetaIdInput = document.getElementById('recetaId')
    const btnDescargar = document.getElementById('btnDescargarPdf')
    const btnEnviar = document.getElementById('btnEnviarMail')
    const estadoEmail = document.getElementById('estadoEmail')

    btnDescargar.addEventListener('click', () => {
      const id = recetaIdInput.value.trim()
      if (!id) {
        alert('Ingresá el ID de la receta')
        return
      }
      window.open(`/api/recetas/${id}/pdf`, '_blank')
    })

    btnEnviar.addEventListener('click', async () => {
      const id = recetaIdInput.value.trim()
      const destinatario = document.getElementById('destinatarioEmail').value.trim()
      const asunto = document.getElementById('asuntoEmail').value.trim()
      const mensaje = document.getElementById('mensajeEmail').value.trim()

      estadoEmail.textContent = ''

      if (!id) {
        alert('Ingresá el ID de la receta')
        return
      }

      if (!destinatario) {
        alert('Ingresá un correo destinatario')
        return
      }

      try {
        const resp = await fetch(`/api/recetas/${id}/enviar`, {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({ destinatario, asunto, mensaje })
        })

        const data = await resp.json()

        if (!resp.ok) {
          throw new Error(data.error || 'Ocurrió un error')
        }

        estadoEmail.textContent = data.mensaje
        estadoEmail.className = 'exito'
      } catch (error) {
        estadoEmail.textContent = error.message
        estadoEmail.className = 'error'
      }
    })
  </script>
</body>
</html>
